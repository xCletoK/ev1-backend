{% extends 'academic/base.html' %}

{% block title %}Estudiantes | Gestión Académica{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
        <h4 class="mb-0 text-primary">Listado de Estudiantes</h4>
        <button class="btn btn-outline-primary btn-sm" onclick="fetchStudents()">Actualizar Datos</button>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th># ID</th>
                        <th>Nombre Completo</th>
                    </tr>
                </thead>
                <tbody id="students-table-body">
                    <tr>
                        <td colspan="2" class="text-center text-muted py-4">
                            <div class="spinner-border spinner-border-sm text-primary" role="status"></div> Cargando datos desde la API...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function fetchStudents() {
        const tbody = document.getElementById('students-table-body');
        try {
            const response = await fetch('/api/students/');
            if (!response.ok) {
                throw new Error(`Error HTTP: ${response.status}`);
            }
            const data = await response.json();
            
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">No existen estudiantes registrados.</td></tr>';
                return;
            }

            data.forEach(student => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold">${student.id}</td>
                    <td>${student.first_name} ${student.last_name}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error al obtener estudiantes:', error);
            tbody.innerHTML = `<tr><td colspan="2" class="text-center text-danger">Error al cargar datos desde la API.</td></tr>`;
        }
    }

    document.addEventListener('DOMContentLoaded', fetchStudents);
</script>
{% endblock %}
